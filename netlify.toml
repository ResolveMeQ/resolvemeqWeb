# SPA fallback: serve index.html for client routes (blog slugs, 404 UI, etc.)
# Live SEO feeds are generated by Django on every request — proxy before the SPA catch-all.
# Prerendered build/{path}/index.html files are served first (catch-all has no force=true).

[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.resolvemeq.net/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/rss.xml"
  to = "https://api.resolvemeq.net/rss.xml"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Core Web Vitals: long-cache hashed assets; short-cache HTML shells
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
